[project]
name = "server"
version = "0.1.0"
description = "Trinetra AI-powered surveillance backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ==========================
    # FastAPI Backend
    # ==========================
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.20",

    # ==========================
    # AI / Computer Vision
    # ==========================
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.64",
    "numpy>=2.4.6",
    "pillow>=12.2.0",

    # ==========================
    # Database
    # ==========================
    "motor>=3.7.1",
    "redis>=8.0.0",

    # ==========================
    # Configuration
    # ==========================
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",

    # ==========================
    # Networking
    # ==========================
    "httpx>=0.28.1",
    "websockets>=16.0",

    # ==========================
    # Serialization
    # ==========================
    "orjson>=3.11.9",
    "pyyaml>=6.0.3",

    # ==========================
    # Logging & Scheduling
    # ==========================
    "loguru>=0.7.3",
    "apscheduler>=3.11.2",

    # ==========================
    # Utilities
    # ==========================
    "aiofiles>=25.1.0",
    "psutil>=7.2.2",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]

# ===========================================
# Black
# ===========================================

[tool.black]
line-length = 100
target-version = ["py311"]

# ===========================================
# Ruff
# ===========================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

# ===========================================
# Pytest
# ===========================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ===========================================
# MyPy
# ===========================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true